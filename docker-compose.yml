# One-command local stack:  docker compose up --build
#   API  http://localhost:8000/docs   (same image as the HF Space)
#   Web  http://localhost:5173        (run separately: cd web && npm run dev)
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: btp-api
    ports:
      - "8000:7860"
    environment:
      BTP_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    read_only: true          # nothing is written to disk (SR-2)
    tmpfs:
      - /tmp                 # audit log lives here, ephemeral
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
