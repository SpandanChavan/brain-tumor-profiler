# Smoke-test config: synthetic phantoms, CPU-friendly. Verifies the pipeline end-to-end; NOT a real result.
seed: 42

data:
  raw_dir: data/raw/BraTS2021
  processed_dir: data/synthetic_processed
  manifest: data/synthetic_processed/manifest.csv
  splits: data/synthetic_processed/splits.json
  num_patients: 120                    # 100-150 per scope
  split_ratios: [0.70, 0.15, 0.15]     # train / val / test (patient-level!)
  modalities: [t1ce, flair]
  tumor_to_empty_ratio: 1.0            # non-tumor slices sampled per tumor slice
  min_brain_fraction: 0.01             # skip slices that are almost all background

model:
  name: flexible_unet
  backbone: efficientnet-b0
  pretrained: true
  in_channels: 2
  out_channels: 1

train:
  epochs: 12
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  num_workers: 0
  early_stopping_patience: 8
  val_every: 1
  bce_weight: 1.0
  dice_weight: 1.0
  output_dir: outputs/synthetic_smoke

inference:
  threshold: 0.5
  min_component_voxels: 20
  tta: true
  batch_size: 16
