[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btp"
version = "0.1.0"
description = "Brain Tumor Segmentation & Profiler: fine-tuned MONAI segmentation with a HIPAA-aligned Streamlit viewer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Advait Samant" },
  { name = "Piyush Bavane" },
  { name = "Spandan Chavan" },
  { name = "Vinit Pal" },
]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.coverage.run]
source = ["src/btp"]
